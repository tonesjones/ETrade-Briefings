[project]
name = "etrade-portfolio-briefing"
version = "0.1.0"
description = "Read-only, tax-aware E*TRADE portfolio briefing generator"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pyetrade>=2.1,<3",
  "python-dotenv>=1,<2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
